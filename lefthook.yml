pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks git --staged --no-banner
pre-push:
  commands:
    verify:
      run: make verify
commit-msg:
  commands:
    no-main: # here, not pre-commit: lefthook skips pre-commit when nothing is staged (--allow-empty)
      run: bash .claude/hooks/no-commit-on-main.sh
    commitlint:
      run: pnpm exec commitlint --edit {1}
