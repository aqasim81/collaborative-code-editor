# Local development database. Host port 5434 avoids clashing with other local Postgres instances.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab_editor
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_editor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
